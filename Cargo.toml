[package]
name = "mythos"
version = "0.1.0"
edition = "2024"

# The library root is src/libs.rs (Cargo only auto-detects src/lib.rs).
[lib]
name = "mythos"
path = "src/libs.rs"

[[bin]]
name = "mythos"
path = "src/main.rs"

[features]
# Search instrumentation for `cargo xtask selfplay`. Off by default: every
# counter lives inside the `stat!` macro, which expands to nothing without it.
stats = []

[dependencies]
log = "0.4.33"

[workspace]
members = ["tuner","xtask"]
exclude = ["target"]

[profile.dev]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
